name: Reproduce scientific release
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned statistical environment
        working-directory: analysis/reproducibility
        run: Rscript environment/restore.R
      - name: Recreate and verify all analysis outputs
        working-directory: analysis/reproducibility
        run: sh run_all.sh
      - name: Validate public release and regression tests
        run: node scripts/verify.mjs && node --test tests/*.test.mjs
